<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELLHOUSE — Entrada</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120a17;
    --bg-elevated:#1c1120;
    --bg-card:#241629;
    --border:#382a3d;
    --border-soft:#2a1e2f;
    --text:#f4ece8;
    --text-dim:#ab9bb0;
    --blood:#c81d3f;
    --blood-bright:#e8355a;
    --blood-dim:#5c1122;
    --ember:#f2a33d;
    --ember-dim:#4a3216;
    --toxic:#43e07a;
    --toxic-dim:#173a26;
    --focus:#f2a33d;
    --radius:14px;
    --shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,29,63,.18), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Metal Mania',cursive;font-weight:400;letter-spacing:.5px;margin:0;}
  ::selection{background:var(--blood-dim);color:#fff;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---------- APP SHELL ---------- */
  #app-screen{display:flex;min-height:100vh;flex-direction:column;}
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(18,10,23,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:14px 16px 0;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand h1{font-size:1.5rem;color:var(--blood-bright);}
  .brand .date{font-size:.68rem;color:var(--text-dim);letter-spacing:1px;}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--toxic);box-shadow:0 0 6px var(--toxic);flex-shrink:0;}
  .conn-dot.off{background:var(--blood-bright);box-shadow:0 0 6px var(--blood-bright);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.3;}}

  .counters{display:flex;gap:10px;margin:14px 0;}
  .counter{
    flex:1;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;text-align:center;
  }
  .counter .num{font-family:'Space Mono',monospace;font-size:1.5rem;font-weight:700;line-height:1;}
  .counter .lbl{font-size:.66rem;letter-spacing:1.2px;color:var(--text-dim);text-transform:uppercase;margin-top:2px;}
  .counter.pending .num{color:var(--ember);}
  .counter.entered .num{color:var(--toxic);}

  .search-wrap{position:relative;margin-bottom:10px;}
  .search-wrap input{
    width:100%;padding:12px 14px 12px 40px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-card);color:var(--text);font-size:.95rem;
  }
  .search-wrap input:focus{border-color:var(--ember);}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--text-dim);}

  .tabs{display:flex;gap:6px;padding-bottom:10px;}
  .tab{
    flex:1;padding:10px 8px;text-align:center;border-radius:10px;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);font-size:.78rem;font-weight:700;letter-spacing:.4px;
  }
  .tab.active{background:var(--bg-card);border-color:var(--ember);color:var(--text);}
  .tab .tcount{opacity:.7;font-family:'Space Mono',monospace;}

  main{flex:1;padding:6px 16px 100px;max-width:720px;width:100%;margin:0 auto;}
  .hint{font-size:.72rem;color:var(--text-dim);margin:2px 2px 10px;}

  /* ---------- CARDS ---------- */
  #list{display:flex;flex-direction:column;gap:10px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .empty-state .glyph{font-size:2.2rem;margin-bottom:8px;}

  .card{
    position:relative;overflow:hidden;
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px;display:flex;align-items:center;gap:12px;
  }
  .card.pending{border-left:3px solid var(--ember);}
  .card.entered{border-left:3px solid var(--toxic);}
  .card-info{flex:1;min-width:0;}
  .card-name{font-size:1.02rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center;}
  .badge{
    font-size:.66rem;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:20px;
    text-transform:uppercase;
  }
  .badge-ticket{background:var(--bg-elevated);color:var(--text-dim);border:1px solid var(--border);}
  .badge-entered{background:var(--toxic-dim);color:var(--toxic);}
  .badge-pending{background:var(--ember-dim);color:var(--ember);}
  .card-time{font-size:.7rem;color:var(--text-dim);font-family:'Space Mono',monospace;}
  .card-actions{flex-shrink:0;display:flex;gap:6px;}

  /* stamp confirmation */
  .card.just-stamped::after{
    content:'ENTROU';
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Metal Mania',cursive;font-size:1.6rem;color:var(--blood-bright);
    background:rgba(18,10,23,.72);
    border:3px solid var(--blood-bright);border-radius:var(--radius);
    animation:stampIn .7s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{opacity:0;transform:scale(2.4) rotate(-14deg);}
    55%{opacity:1;transform:scale(.94) rotate(-6deg);}
    75%{transform:scale(1.04) rotate(-8deg);}
    100%{opacity:0;transform:scale(1) rotate(-8deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .card.just-stamped::after{animation:none;opacity:.9;}
    .conn-dot.off{animation:none;}
  }

  /* admin table rows */
  .card.admin-row{padding:10px 12px;gap:8px;}
  .card.admin-row .card-name{font-size:.92rem;}
  .admin-icon-btn{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
  }
  .admin-icon-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .admin-stats{font-size:.75rem;color:var(--text-dim);font-family:'Space Mono',monospace;}

  /* ---------- FAB + modal ---------- */
  .fab-row{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:15;padding:0 16px;}
  .fab{
    background:linear-gradient(180deg,var(--blood-bright),var(--blood));color:#fff;
    border:none;border-radius:30px;padding:14px 22px;font-weight:800;font-size:.9rem;
    box-shadow:0 8px 22px rgba(200,29,63,.4);display:flex;align-items:center;gap:8px;
  }
  .fab.secondary{background:var(--bg-elevated);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--text);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:10px;padding:13px 18px;font-size:.95rem;font-weight:700;
    transition:transform .1s ease, filter .15s ease; user-select:none;
  }
  .btn:active{transform:scale(.97);}
  .btn-blood{background:linear-gradient(180deg,var(--blood-bright),var(--blood));color:#fff;box-shadow:0 4px 14px rgba(200,29,63,.35);}
  .btn-blood:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-toxic{background:linear-gradient(180deg,#4fef8a,var(--toxic));color:#08210f;}
  .btn-sm{padding:9px 12px;font-size:.82rem;border-radius:8px;}
  .btn:disabled{opacity:.5;pointer-events:none;}

  #modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(8,4,10,.7);backdrop-filter:blur(2px);
    z-index:50;align-items:flex-end;justify-content:center;
  }
  #modal-overlay.open{display:flex;}
  .modal{
    width:100%;max-width:480px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:20px 20px 0 0;padding:22px 20px 26px;max-height:88vh;overflow-y:auto;
    animation:slideUp .22s ease;
  }
  @media(min-width:540px){
    #modal-overlay{align-items:center;}
    .modal{border-radius:16px;}
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{font-size:1.3rem;color:var(--blood-bright);margin-bottom:16px;}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:1.3rem;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:6px;letter-spacing:.3px;}
  .field input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-card);color:var(--text);font-size:1rem;
  }
  .field input:focus{border-color:var(--ember);}
  textarea.field-textarea{
    width:100%;min-height:130px;padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-card);color:var(--text);font-size:.88rem;font-family:'Space Mono',monospace;resize:vertical;
  }
  .import-preview{font-size:.78rem;color:var(--text-dim);margin-top:8px;}

  /* ---------- loading overlay (bloqueia tudo até confirmar no servidor) ---------- */
  .loading-overlay{
    display:none;position:fixed;inset:0;z-index:200;
    background:rgba(8,4,10,.82);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;
  }
  .loading-overlay.open{display:flex;}
  .loading-box{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:28px 34px;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow);
  }
  .spinner{
    width:40px;height:40px;border-radius:50%;
    border:4px solid var(--border);border-top-color:var(--blood-bright);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{font-size:.85rem;color:var(--text-dim);text-align:center;max-width:220px;}
  @media (prefers-reduced-motion: reduce){.spinner{animation:spin 1.6s linear infinite;}}

  /* ---------- toasts ---------- */
  #toast-wrap{position:fixed;top:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;}
  .toast{
    background:var(--bg-elevated);border:1px solid var(--border);border-left:4px solid var(--toxic);
    color:var(--text);padding:11px 16px;border-radius:10px;font-size:.85rem;box-shadow:var(--shadow);
    max-width:90vw;animation:toastIn .25s ease;
  }
  .toast.warn{border-left-color:var(--ember);}
  .toast.error{border-left-color:var(--blood-bright);}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

  datalist{}
</style>
</head>
<body>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="conn-dot" id="conn-dot"></span>
        <div>
          <h1>HELLHOUSE</h1>
          <div class="date">CONTROLE DE ENTRADA · 03/10</div>
        </div>
      </div>
    </div>

    <div class="counters">
      <div class="counter pending"><div class="num" id="count-pending">0</div><div class="lbl">Pendentes</div></div>
      <div class="counter entered"><div class="num" id="count-entered">0</div><div class="lbl">Já entraram</div></div>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Buscar por nome..." autocomplete="off">
    </div>

    <div class="tabs" id="tabs"></div>
  </header>

  <main>
    <div class="hint" id="result-hint"></div>
    <div id="admin-toolbar-slot"></div>
    <div id="list"><div class="empty-state">Carregando lista...</div></div>
  </main>

  <div class="fab-row">
    <button class="fab secondary" id="btn-open-backup" type="button">💾 Backup</button>
    <button class="fab secondary" id="btn-open-import" type="button">📋 Colar lista</button>
    <button class="fab" id="btn-open-add" type="button">+ Adicionar</button>
  </div>
</div>

<div id="modal-overlay"><div class="modal" id="modal-body"></div></div>
<input id="backup-file-input" type="file" accept=".json,application/json" style="display:none;">
<div id="toast-wrap"></div>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <div class="spinner" id="loading-spinner"></div>
    <div class="loading-msg" id="loading-msg">Confirmando...</div>
    <button class="btn btn-blood btn-sm" id="loading-retry-btn" type="button" style="display:none;">Recarregar página</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInAnonymously, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getDatabase, ref, push, set, update, remove, onValue, get, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

/* ===================== CONFIG ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyCpf7kWZzp62ywgk6kEERHw4KIc06sQe7E",
  authDomain: "halw-1cf6e.firebaseapp.com",
  databaseURL: "https://halw-1cf6e-default-rtdb.firebaseio.com",
  projectId: "halw-1cf6e",
  storageBucket: "halw-1cf6e.firebasestorage.app",
  messagingSenderId: "770946829148",
  appId: "1:770946829148:web:8732606b52465f3b6e8f99",
  measurementId: "G-42H9QJ1469"
};

/* ===================== INIT ===================== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const peopleRef = ref(db, "people");

// Sem tela de login: conecta de forma anônima em segundo plano assim que a
// página carrega. Isso ainda satisfaz regras do Realtime Database que exigem
// "auth != null" (plano Spark), mas ninguém precisa digitar e-mail/senha.
// Com isso, também não há mais distinção de "admin": a aba Admin fica
// sempre visível para qualquer pessoa que abrir a página.
let authReady = false;

// Mostra a tela de carregamento já no início e só libera o app quando o
// login anônimo E os dados já tiverem chegado — evita que alguém consiga
// clicar em algo antes da conexão estar pronta (o que antes podia falhar
// silenciosamente com erro de permissão).
showLoading("Conectando...");
function maybeHideBootLoading(){
  if(authReady && loaded){
    clearTimeout(bootTimeout);
    hideLoading();
  }
}
// IMPORTANTE: este timer só pode ser cancelado quando o app estiver
// REALMENTE pronto (auth + dados). Antes, ele era cancelado assim que o
// login anônimo terminava, mesmo que a lista de pessoas nunca chegasse —
// nesse caso a tela de carregamento ficava girando pra sempre, sem aviso
// e sem botão de recarregar. Agora qualquer trava (auth OU dados) aciona
// o aviso, e só é cancelado dentro de maybeHideBootLoading().
const bootTimeout = setTimeout(()=>{
  if(!(authReady && loaded)){
    showStuck("Demorando pra conectar... verifique sua internet ou toque em recarregar.");
  }
}, 6000);

// Guarda a sessão anônima no navegador antes de logar, pra reaproveitar o
// signInAnonymously e não criar uma conta nova a cada refresh — a sessão
// fica salva no navegador (localStorage) e é reaproveitada nos acessos seguintes.
Promise.race([
  setPersistence(auth, browserLocalPersistence),
  new Promise(resolve => setTimeout(resolve, 2500))
])
  .catch(()=>{})
  .finally(()=>{
    signInAnonymously(auth).catch((err) => {
      clearTimeout(bootTimeout);
      showStuck("Não foi possível conectar. Verifique a internet e toque em recarregar.");
      showToast("Erro ao conectar: " + err.message, "error");
    });
  });

/* ===================== BACKUP ===================== */
// O backup local fica salvo automaticamente neste celular/navegador.
// Também existe uma cópia no Firebase em /backup_latest.
// IMPORTANTE: o backup local é a proteção contra uma perda total do Firebase.
const LOCAL_BACKUP_KEY = "hellhouse_backup_v1";
const LOCAL_BACKUP_META_KEY = "hellhouse_backup_meta_v1";

function makeBackupPayload(data = people){
  return {
    version: 1,
    app: "HELLHOUSE",
    savedAt: Date.now(),
    people: data || {}
  };
}

function saveLocalBackup(data = people, silent = true){
  try{
    const payload = makeBackupPayload(data);
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(payload));
    localStorage.setItem(LOCAL_BACKUP_META_KEY, JSON.stringify({
      savedAt: payload.savedAt,
      count: Object.keys(payload.people || {}).length
    }));
    return true;
  }catch(err){
    if(!silent) showToast("Não consegui salvar o backup neste celular.", "error");
    return false;
  }
}

function getLocalBackup(){
  try{
    const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
    if(!raw) return null;
    const payload = JSON.parse(raw);
    if(!payload || payload.app !== "HELLHOUSE" || !payload.people) return null;
    return payload;
  }catch(_){ return null; }
}

async function saveCloudBackup(data = people){
  // Guarda uma cópia separada dentro do próprio Firebase.
  // Não substitui o backup do celular: se o banco inteiro for apagado,
  // esta cópia também poderá ser perdida.
  if(!authReady) return false;
  try{
    await set(ref(db, "backup_latest"), makeBackupPayload(data));
    return true;
  }catch(_){
    return false;
  }
}

function formatBackupDate(ms){
  return ms ? new Date(ms).toLocaleString("pt-BR") : "—";
}

function downloadBackup(){
  const payload = makeBackupPayload(people);
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `HELLHOUSE-BACKUP-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  saveLocalBackup(people);
  showToast("Backup salvo no celular.", "ok");
}

function openBackupModal(){
  const local = getLocalBackup();
  const localCount = local ? Object.keys(local.people || {}).length : 0;
  openModal(`
    <button class="modal-close" type="button" onclick="window.__closeModal()">✕</button>
    <h2>Backup da lista</h2>
    <p class="hint" style="margin-bottom:14px;">
      A lista já é salva automaticamente neste celular. Para ter uma cópia que pode ser guardada em outro lugar, toque em <strong>Salvar backup no celular</strong>.
    </p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button type="button" class="btn btn-blood btn-block" id="btn-save-backup">💾 Salvar backup no celular</button>
      <button type="button" class="btn btn-ghost btn-block" id="btn-restore-local">↩ Restaurar último backup deste celular</button>
      <button type="button" class="btn btn-ghost btn-block" id="btn-choose-backup">📂 Restaurar arquivo de backup</button>
    </div>
    <p class="import-preview" style="margin-top:14px;">
      Backup automático neste aparelho: ${local ? `sim · ${localCount} pessoa(s) · ${formatBackupDate(local.savedAt)}` : "ainda não criado"}
    </p>
    <p class="import-preview">
      Dica: antes da festa, salve o arquivo de backup e mande para seu WhatsApp/Google Drive. Assim você terá uma cópia fora do celular.
    </p>
  `);

  document.getElementById("btn-save-backup")?.addEventListener("click", downloadBackup);

  document.getElementById("btn-restore-local")?.addEventListener("click", async ()=>{
    const backup = getLocalBackup();
    if(!backup){
      showToast("Não existe backup neste celular.", "warn");
      return;
    }
    await restoreBackupPayload(backup);
  });

  document.getElementById("btn-choose-backup")?.addEventListener("click", ()=>{
    closeModal();
    document.getElementById("backup-file-input")?.click();
  });
}

async function restoreBackupPayload(payload){
  if(!requireAdmin()) return;
  const backupPeople = payload?.people;
  if(!backupPeople || typeof backupPeople !== "object"){
    showToast("Arquivo de backup inválido.", "error");
    return;
  }

  const count = Object.keys(backupPeople).length;
  if(!count){
    showToast("Esse backup está vazio. Nada foi restaurado.", "warn");
    return;
  }

  const ok = confirm(
    `Restaurar ${count} pessoa(s) deste backup?\n\n` +
    `Isso vai substituir a lista atual no Firebase.`
  );
  if(!ok) return;

  if(!authReady){
    showToast("Ainda conectando. Aguarde um instante.", "warn");
    return;
  }

  showLoading("Salvando segurança antes da restauração...");
  try{
    if(Object.keys(people || {}).length > 0){
      saveLocalBackup(people, false);
      await saveCloudBackup(people);
    }
    showLoading("Restaurando backup...");
    // Substitui somente o nó people. O backup em si não é apagado.
    await set(peopleRef, backupPeople);
    const check = await get(peopleRef);
    if(!check.exists()){
      showToast("Não consegui confirmar a restauração.", "error");
      return;
    }
    saveLocalBackup(backupPeople);
    showToast(`Backup restaurado: ${count} pessoa(s).`, "ok");
  }catch(err){
    showToast("Erro ao restaurar: " + err.message, "error");
  }finally{
    hideLoading();
    closeModal();
  }
}

function normalize(str){
  return (str || "")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}
function escapeHtml(str){
  return (str ?? "").toString().replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}
function showToast(msg, type="ok"){

function getFilteredEntries(){
  const entries = Object.entries(people);
  let filtered = entries.filter(([id, p]) => {
    if(currentTab === "pending") return !p.entered;
    if(currentTab === "entered") return !!p.entered;
    return true; // admin
  });
  if(searchTerm){
    filtered = filtered.filter(([id, p]) => (p.normalizedName || normalize(p.name)).includes(searchTerm));
  }
  filtered.sort((a,b)=>{
    if(currentTab === "entered") return (b[1].enteredAt||0) - (a[1].enteredAt||0);
    return (a[1].name||"").localeCompare(b[1].name||"", "pt-BR");
  });
  return filtered;
}

/* ===================== AÇÕES DE ENTRADA ===================== */
// Marca a entrada e SÓ libera a tela quando o próprio servidor confirmar
// que gravou. Enquanto isso, uma tela de carregamento cobre o app inteiro
// pra ninguém clicar em outra pessoa por engano e pra nunca dar a entrada
// como feita sem ter certeza (mesmo que a internet do local esteja ruim).
async function markEntered(id){
  if(processing.has(id)) return;
  if(!authReady){
    showToast("Ainda conectando... aguarde um instante e tente de novo.", "warn");
    return;
  }
  processing.add(id);
  const person = people[id];
  showLoading(`Marcando entrada${person?.name ? " de " + person.name : ""}...`);
  render();
  let stamped = false;
  try{
    const result = await runTransaction(ref(db, `people/${id}`), (current)=>{
      if(!current) return;                 // pessoa não existe mais -> aborta (undefined = abort)
      if(current.entered) return;          // já tinha entrado -> aborta (undefined = abort)
      current.entered = true;
      current.enteredAt = Date.now();
      current.enteredBy = currentUser?.uid || "desconhecido";
      return current;
    });

    if(!result.committed){
      if(!result.snapshot.exists()){
        showToast("Esse cadastro não existe mais.", "error");
      }else{
        showToast("Essa pessoa já foi liberada por outro aparelho.", "warn");
      }
      return;
    }

    // Confirmação extra: relê direto do banco pra ter 100% de certeza
    // que ficou salvo antes de sumir com o carregamento.
    showLoading("Verificando no servidor...");
    const check = await get(ref(db, `people/${id}/entered`));
    if(check.val() !== true){
      showToast("Não deu pra confirmar a entrada. Tente de novo.", "error");
      return;
    }

    showToast(`${result.snapshot.val()?.name || "Pessoa"} liberado(a) para entrar.`, "ok");
    stamped = true;
  }catch(err){
    showToast("Erro ao marcar entrada: " + err.message, "error");
  }finally{
    processing.delete(id);
    hideLoading();
    render();
    if(stamped){
      requestAnimationFrame(()=>{
        const card = document.querySelector(`.card[data-id="${id}"]`);
        if(card){
          card.classList.add("just-stamped");
          setTimeout(()=>card.classList.remove("just-stamped"), 750);
        }
      });
    }
  }
}

async function markPending(id){
  if(processing.has(id)) return;
  if(!authReady){
    showToast("Ainda conectando... aguarde um instante e tente de novo.", "warn");
    return;
  }
  processing.add(id);
  const person = people[id];
  showLoading(`Desfazendo entrada${person?.name ? " de " + person.name : ""}...`);
  render();
  try{
    // Confere se o registro ainda existe antes de escrever — sem isso, um
    // update() em um caminho apagado por outro aparelho recriaria um
    // registro "fantasma" só com os campos de entrada, sem nome/ingresso.
    const existing = await get(ref(db, `people/${id}`));
    if(!existing.exists()){
      showToast("Esse cadastro não existe mais.", "error");
      return;
    }

    await update(ref(db, `people/${id}`), { entered:false, enteredAt:null, enteredBy:null });

    showLoading("Verificando no servidor...");
    const check = await get(ref(db, `people/${id}/entered`));
    if(check.val() !== false){
      showToast("Não deu pra confirmar. Tente de novo.", "error");
    }else{
      showToast("Entrada desfeita.", "ok");
    }
  }catch(err){
    showToast("Erro ao desfazer: " + err.message, "error");
  }finally{
    processing.delete(id);
    hideLoading();
    render();
  }
}

// Analisa o texto colado: separa quem entra de fato, quem é repetido
// (já cadastrado ou repetido dentro da própria lista colada) e linhas
// estranhas (sem nenhuma letra, ou nome curto demais pra ser um nome).
function analyzeImport(rawText){
  const lines = rawText.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const existingNormalized = new Set(Object.values(people).map(p => p.normalizedName || normalize(p.name)));
  const seenInPaste = new Set();
  const toImport = [];
  let duplicatesExisting = 0;
  let duplicatesInPaste = 0;
  let weird = 0;

  lines.forEach(line=>{
    const parts = line.split(/[,;\t]/).map(p=>p.trim()).filter(Boolean);
    const name = parts[0];
    if(!name) return;
    const ticket = parts[1] || "";
    const norm = normalize(name);
    const hasLetter = /[a-zà-ÿ]/i.test(name);

    if(!hasLetter || name.length < 2){
      weird++;
      return;
    }
    if(existingNormalized.has(norm)){
      duplicatesExisting++;
      return;
    }
    if(seenInPaste.has(norm)){
      duplicatesInPaste++;
      return;
    }
    seenInPaste.add(norm);
    toImport.push({name, ticket});
  });

  return { totalLines: lines.length, toImport, duplicatesExisting, duplicatesInPaste, weird };
}

function describeAnalysis(a){
  if(!a.totalLines) return "";
  const parts = [`${a.toImport.length} pessoa(s) serão adicionadas`];
  if(a.duplicatesExisting) parts.push(`${a.duplicatesExisting} já cadastrada(s) (ignorada${a.duplicatesExisting>1?'s':''})`);
  if(a.duplicatesInPaste) parts.push(`${a.duplicatesInPaste} repetida(s) na lista colada (ignorada${a.duplicatesInPaste>1?'s':''})`);
  if(a.weird) parts.push(`${a.weird} linha(s) estranha(s) (ignorada${a.weird>1?'s':''})`);
  return parts.join(" · ");
}

let importInFlight = false;
async function bulkImport(rawText){
  if(importInFlight) return; // trava contra clique duplo / duplo-toque no botão
  if(!authReady){
    showToast("Ainda conectando... aguarde um instante e tente de novo.", "warn");
    return;
  }
  // IMPORTANTE: usa exatamente a mesma análise que gera a prévia (analyzeImport),
  // em vez de reprocessar o texto do zero. Antes disso, esta função ignorava
  // a checagem de duplicados/linhas estranhas mostrada na prévia e importava
  // TUDO, inclusive nomes repetidos e lixo — agora os dois ficam sempre iguais.
  const analysis = analyzeImport(rawText);
  if(!analysis.totalLines){ showToast("Cole ao menos um nome.", "error"); return false; }
  if(analysis.toImport.length === 0){
    showToast("Nada novo para importar (tudo já cadastrado, repetido ou inválido).", "warn");
    return false;
  }

  importInFlight = true;
  const confirmBtn = document.getElementById("btn-confirm-import");
  if(confirmBtn) confirmBtn.disabled = true;

  const updates = {};
  analysis.toImport.forEach(({name, ticket})=>{
    const id = push(peopleRef).key;
    updates[`people/${id}`] = {
      name,
      normalizedName: normalize(name),
      ticket: ticket || "",
      entered: false,
      enteredAt: null,
      enteredBy: null,
      createdAt: serverTimestamp(),
      createdBy: currentUser?.uid || "desconhecido"
    };
  });

  showLoading(`Importando ${analysis.toImport.length} pessoa(s)...`);
  try{
    await update(ref(db), updates);

    // Confirmação extra: relê ao menos um dos registros gravados pra ter
    // certeza de que a importação realmente foi salva no servidor.
    showLoading("Verificando no servidor...");
    const sampleId = Object.keys(updates)[0].split("/")[1];
    const check = await get(ref(db, `people/${sampleId}`));
    if(!check.exists()){
      showToast("Não deu pra confirmar a importação. Confira a lista e tente de novo.", "error");
      return false;
    }

    let msg = `${analysis.toImport.length} pessoa(s) importada(s).`;
    const skipped = analysis.duplicatesExisting + analysis.duplicatesInPaste + analysis.weird;
    if(skipped) msg += ` ${skipped} linha(s) ignorada(s) (repetida ou inválida).`;
    showToast(msg, "ok");
    return true;
  }catch(err){
    showToast("Erro ao importar: " + err.message, "error");
    return false;
  }finally{
    importInFlight = false;
    if(confirmBtn) confirmBtn.disabled = false;
    hideLoading();
  }
}

/* ===================== ADMIN: editar / excluir / exportar ===================== */
function openEditModal(id){
  if(!requireAdmin()) return;
  const p = people[id];
  if(!p) return;
  openModal(`
    <button class="modal-close" type="button" onclick="window.__closeModal()">✕</button>
    <h2>Editar pessoa</h2>
    <form id="edit-form">
      <div class="field">
        <label for="edit-name">Nome</label>
        <input id="edit-name" type="text" value="${escapeHtml(p.name||"")}" required>
      </div>
      <div class="field">
        <label for="edit-ticket">Ingresso / lote</label>
        <input id="edit-ticket" type="text" list="ticket-options" value="${escapeHtml(p.ticket||"")}">
        ${ticketDatalist()}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="window.__closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-blood">Salvar</button>
      </div>
    </form>
  `);
  document.getElementById("edit-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    if(submitBtn?.disabled) return;
    if(!authReady){
      showToast("Ainda conectando... aguarde um instante e tente de novo.", "warn");
      return;
    }
    const name = document.getElementById("edit-name").value.trim();
    const ticket = document.getElementById("edit-ticket").value.trim();
    if(!name) return;
    if(submitBtn) submitBtn.disabled = true;
    showLoading(`Salvando ${name}...`);
    try{
      const existing = await get(ref(db, `people/${id}`));
      if(!existing.exists()){
        showToast("Esse cadastro não existe mais.", "error");
        return;
      }
      await update(ref(db, `people/${id}`), { name, normalizedName: normalize(name), ticket });
      showToast("Cadastro atualizado.", "ok");
    }catch(err){
      showToast("Erro ao salvar: " + err.message, "error");
    }finally{
      hideLoading();
      closeModal();
    }
  });
}

function confirmDelete(id){
  if(!requireAdmin()) return;
  const p = people[id];
  if(!p) return;
  openModal(`
    <button class="modal-close" type="button" onclick="window.__closeModal()">✕</button>
    <h2>Excluir pessoa</h2>
    <p>Tem certeza que quer excluir <strong>${escapeHtml(p.name)}</strong>? Essa ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="window.__closeModal()">Cancelar</button>
      <button type="button" class="btn btn-blood" id="btn-confirm-delete">Excluir</button>
    </div>
  `);
  const confirmBtn = document.getElementById("btn-confirm-delete");
  confirmBtn.addEventListener("click", async ()=>{
    if(confirmBtn.disabled) return;
    if(!authReady){
      showToast("Ainda conectando... aguarde um instante e tente de novo.", "warn");
      return;
    }
    confirmBtn.disabled = true;
    showLoading(`Excluindo ${p.name}...`);
    try{
      saveLocalBackup(people, false);
      await saveCloudBackup(people);
      await remove(ref(db, `people/${id}`));
      showToast("Registro excluído.", "ok");
    }catch(err){
      showToast("Erro ao excluir: " + err.message, "error");
    }finally{
      hideLoading();
      closeModal();
    }
  });
}

function exportCSV(){
  if(!requireAdmin()) return;
  const rows = [["Nome","Ingresso","Status","Cadastrado em","Entrada em"]];
  Object.values(people)
    .sort((a,b)=>(a.name||"").localeCompare(b.name||"", "pt-BR"))
    .forEach(p=>{
      rows.push([
        p.name || "", p.ticket || "", p.entered ? "ENTROU" : "PENDENTE",
        fmtDateTime(p.createdAt),
        p.entered ? fmtDateTime(p.enteredAt) : ""
      ]);
    });
  const csv = rows.map(r => r.map(f => `"${String(f).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `hellhouse-lista-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
