<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELLHOUSE — Entrada</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 25px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
      letter-spacing: 2px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: #111;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
    }

    .stat-label {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .search {
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      border: 1px solid #292929;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .search:focus {
      border-color: #555;
    }

    .add-box {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .add-input {
      flex: 1;
      padding: 14px;
      background: #111;
      color: white;
      border: 1px solid #292929;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .add-button {
      background: white;
      color: black;
      padding: 0 18px;
      border-radius: 10px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tab {
      padding: 13px;
      border-radius: 10px;
      background: #111;
      color: #888;
      border: 1px solid #222;
    }

    .tab.active {
      background: #fff;
      color: #000;
    }

    .person {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .person-name {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .person-info {
      color: #777;
      font-size: 11px;
      margin-top: 4px;
    }

    .enter-button {
      background: #fff;
      color: #000;
      padding: 11px 14px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .undo-button {
      background: #222;
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 40px 10px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .error {
      background: #250d0d;
      border: 1px solid #5b2020;
      color: #ff8d8d;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      font-size: 13px;
    }

    @media (max-width: 450px) {
      .logo {
        font-size: 30px;
      }

      .person {
        align-items: flex-start;
      }

      .enter-button,
      .undo-button {
        padding: 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">HELLHOUSE</div>
    <div class="subtitle">CONTROLE DE ENTRADA • 03/10</div>
  </header>

  <div id="error" class="error"></div>

  <div class="stats">
    <div class="stat">
      <div id="pendingCount" class="stat-number">0</div>
      <div class="stat-label">PENDENTES</div>
    </div>

    <div class="stat">
      <div id="enteredCount" class="stat-number">0</div>
      <div class="stat-label">JÁ ENTRARAM</div>
    </div>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Procurar nome..."
  >

  <div class="add-box">
    <input
      id="newName"
      class="add-input"
      type="text"
      placeholder="Nome da pessoa"
    >

    <button class="add-button" onclick="addPerson()">
      + ADICIONAR
    </button>
  </div>

  <div class="tabs">
    <button id="pendingTab" class="tab active" onclick="changeTab('pending')">
      PENDENTES
    </button>

    <button id="enteredTab" class="tab" onclick="changeTab('entered')">
      JÁ ENTRARAM
    </button>
  </div>

  <div id="list">
    <div class="loading">Carregando lista...</div>
  </div>

</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    update,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  // ==============================
  // FIREBASE
  // ==============================

  const firebaseConfig = {
    apiKey: "AIzaSyCpf7kWZzp62ywgk6kEERHw4KIc06sQe7E",
    authDomain: "halw-1cf6e.firebaseapp.com",
    databaseURL: "https://halw-1cf6e-default-rtdb.firebaseio.com",
    projectId: "halw-1cf6e",
    storageBucket: "halw-1cf6e.firebasestorage.app",
    messagingSenderId: "770946829148",
    appId: "1:770946829148:web:8732606b52465f3b6e8f99",
    measurementId: "G-42H9QJ1469"
  };


  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);


  // ==============================
  // VARIÁVEIS
  // ==============================

  let people = {};
  let currentTab = "pending";


  // ==============================
  // LER BANCO EM TEMPO REAL
  // ==============================

  const peopleRef = ref(db, "people");

  onValue(peopleRef, (snapshot) => {

    people = snapshot.val() || {};

    render();

  }, (error) => {

    showError("Erro ao acessar o banco de dados: " + error.message);

  });


  // ==============================
  // MOSTRAR LISTA
  // ==============================

  function render() {

    const list = document.getElementById("list");
    const search = document.getElementById("search").value
      .toLowerCase()
      .trim();

    const entries = Object.entries(people);

    const pending = entries.filter(([id, person]) => !person.entered);
    const entered = entries.filter(([id, person]) => person.entered);

    document.getElementById("pendingCount").textContent = pending.length;
    document.getElementById("enteredCount").textContent = entered.length;


    let selected = currentTab === "pending"
      ? pending
      : entered;


    if (search) {

      selected = selected.filter(([id, person]) =>
        person.name.toLowerCase().includes(search)
      );

    }


    selected.sort((a, b) =>
      a[1].name.localeCompare(b[1].name)
    );


    if (selected.length === 0) {

      list.innerHTML = `
        <div class="empty">
          ${search ? "Nenhuma pessoa encontrada." : "Nenhuma pessoa nesta lista."}
        </div>
      `;

      return;

    }


    list.innerHTML = selected.map(([id, person]) => {

      if (currentTab === "pending") {

        return `
          <div class="person">

            <div>
              <div class="person-name">
                ${escapeHTML(person.name)}
              </div>

              <div class="person-info">
                ${person.ticket || "Ingresso"}
              </div>
            </div>

            <button
              class="enter-button"
              onclick="markEntered('${id}')"
            >
              ENTROU ✓
            </button>

          </div>
        `;

      } else {

        return `
          <div class="person">

            <div>
              <div class="person-name">
                ${escapeHTML(person.name)}
              </div>

              <div class="person-info">
                Entrada confirmada
              </div>
            </div>

            <button
              class="undo-button"
              onclick="markPending('${id}')"
            >
              DESFAZER
            </button>

          </div>
        `;

      }

    }).join("");

  }


  // ==============================
  // ADICIONAR PESSOA
  // ==============================

  window.addPerson = async function() {

    const input = document.getElementById("newName");

    const name = input.value.trim();

    if (!name) {

      alert("Digite o nome da pessoa.");

      return;

    }


    try {

      const newPerson = push(ref(db, "people"));

      await set(newPerson, {

        name: name,
        entered: false,
        ticket: "Ingresso",
        createdAt: Date.now()

      });


      input.value = "";

      document.getElementById("search").value = "";

      changeTab("pending");

    } catch (error) {

      showError("Não foi possível adicionar: " + error.message);

    }

  };


  // ==============================
  // MARCAR COMO ENTROU
  // ==============================

  window.markEntered = async function(id) {

    try {

      await update(ref(db, "people/" + id), {

        entered: true,
        enteredAt: Date.now()

      });

    } catch (error) {

      showError("Erro ao marcar entrada: " + error.message);

    }

  };


  // ==============================
  // DESFAZER
  // ==============================

  window.markPending = async function(id) {

    try {

      await update(ref(db, "people/" + id), {

        entered: false,
        enteredAt: null

      });

    } catch (error) {

      showError("Erro ao desfazer: " + error.message);

    }

  };


  // ==============================
  // ABAS
  // ==============================

  window.changeTab = function(tab) {

    currentTab = tab;

    document
      .getElementById("pendingTab")
      .classList.toggle("active", tab === "pending");

    document
      .getElementById("enteredTab")
      .classList.toggle("active", tab === "entered");

    render();

  };


  // ==============================
  // PESQUISA
  // ==============================

  document
    .getElementById("search")
    .addEventListener("input", render);


  document
    .getElementById("newName")
    .addEventListener("keydown", (event) => {

      if (event.key === "Enter") {

        addPerson();

      }

    });


  // ==============================
  // SEGURANÇA CONTRA HTML
  // ==============================

  function escapeHTML(text) {

    return text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // ==============================
  // ERROS
  // ==============================

  function showError(message) {

    const error = document.getElementById("error");

    error.textContent = message;

    error.style.display = "block";

  }

</script>

</body>
</html>
